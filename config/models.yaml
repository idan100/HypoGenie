# ── Active profile ───────────────────────────────────────────────────────────
# Change THIS ONE LINE to switch all models at once.
active_profile: cheap   # cheap | medium | strong

# ── Profiles ─────────────────────────────────────────────────────────────────
# openai  → SPEC_PROCESSOR, GAP_FINDER, GAP_FINDER_CRITIC, EXPLOIT_PLANNER
# anthropic → BUILDER, EXPLOITER
profiles:
  cheap:   { openai: "gpt-4.1-mini",   anthropic: "claude-haiku-4-5"  }
  medium:  { openai: "gpt-4.1",        anthropic: "claude-haiku-4-5"  }  # isolates planner quality
  strong:  { openai: "gpt-4.1",        anthropic: "claude-sonnet-4-5" }

# ── Optional per-role overrides ───────────────────────────────────────────────
# Takes precedence over the active profile.  Format: "provider:model"
# Example:
#   EXPLOITER_MODEL: "anthropic:claude-opus-4-5"
role_overrides: {}

# ── API key env-var names ─────────────────────────────────────────────────────
anthropic:
  api_key_env: ANTHROPIC_API_KEY
openai:
  api_key_env: OPENAI_API_KEY
