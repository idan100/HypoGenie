hypothesis:
  description: |
    RFC 9000 §4.6 controls peer-initiated stream concurrency through cumulative
    stream limits. When Caddy (caddy:2.11.4, quic-go v0.59.1) acts as an HTTP/3
    reverse proxy, two independent resource accumulation axes exist:

    - Layer 1 (quic-go): stream credit is recycled at transport-level closure
      before application-level processing completes, enabling the client to open
      more streams than the server intends to permit.

    - Layer 2 (Caddy proxy, the focus of this test): each HTTP/3 stream that
      Caddy begins proxying opens an HTTP/1.1 connection to the backend and
      spawns a proxy goroutine. If the client cancels the QUIC stream with
      STOP_SENDING before the backend responds, the proxy goroutine continues
      waiting for the upstream reply. HTTP/1.1 has no stream-level cancellation
      primitive; cancelling would require closing the backend TCP connection,
      which Caddy's connection pool avoids. The goroutine blocks until the
      upstream responds or the proxy timeout fires.

    The key measurement is at the BACKEND, not the proxy. The backend tracks
    concurrent in-flight requests via an active_requests counter. Under attack:
      - client opens QUIC stream → proxy goroutine starts → backend begins work
      - client sends STOP_SENDING → QUIC stream closes at proxy
      - backend active_requests REMAINS elevated (proxy goroutine still waiting)
    If active_requests grows proportionally to stream churn rate, Layer 2 is
    confirmed independently of the quic-go stream credit bug.

    Test topology:
      [attack client on host]  →  UDP :443 QUIC h3  →
      [proxy: caddy:2.11.4, --cpus=1]  →  HTTP/1.1 TCP (Docker bridge)  →
      [backend: python:3.11-slim, 50ms sleep, /metrics exposed on host :18080]

    The backend exposes GET /metrics → {"active": N} on port 18080 (host-mapped).
    The exploit script sends rapid STOP_SENDING streams and polls /metrics to
    measure the peak active count. CPU on the proxy container is a secondary signal.

    Assumptions:
    - A1: The implementation can be forced to grant MAX_STREAMS credit on
          transport-level stream closure before application-level request
          processing completes, or advertises an excessively large initial
          stream limit.
    - A2: Per-stream HTTP/3 request processing incurs non-trivial CPU work
          that is not cancelled promptly when the stream is closed at the
          transport level.
    - A3: Caddy does not promptly cancel the in-flight backend HTTP/1.1 proxy
          request when the QUIC frontend stream is cancelled by the client.
    - A4: Backend proxy goroutines accumulate and do not retire promptly while
          QUIC stream credits are recycled and new frontend streams are admitted.
    - A5: No application-layer stream-churn or reset-rate limit exists on the
          HTTP/3 frontend or proxy layer.
    - A6: The client can predict the server's packet numbers for RESET_STREAM
          frames and time premature ACKs to accelerate stream closure without
          triggering protocol violations.
    - A7: The client can predict the server's MAX_STREAMS frames and prematurely
          open streams using expected credit, increasing stream churn rate.

  dos_class: resource_exhaustion

target:
  repo: https://github.com/caddyserver/caddy
  version: v2.11.4
  protocol: QUIC
  entry_point: "UDP port 443, QUIC with ALPN h3"
  services:
    - name: proxy
      role: target
      docker_image: "caddy:2.11.4"
      server_config: |
        {
            auto_https off
            admin off
        }

        :443 {
            tls /certs/server.crt /certs/server.key
            reverse_proxy backend:8080
        }

    - name: backend
      role: upstream
      docker_image: "python:3.11-slim"
      ports: "18080:8080/tcp"
      command:
        - "python3"
        - "-c"
        - |
          import time, threading, json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          _lock = threading.Lock()
          _active = 0
          _peak = 0

          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  global _active, _peak
                  if self.path == '/metrics':
                      with _lock:
                          data = json.dumps({"active": _active, "peak": _peak}).encode()
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json')
                      self.end_headers()
                      self.wfile.write(data)
                      return
                  with _lock:
                      _active += 1
                      if _active > _peak:
                          _peak = _active
                  try:
                      time.sleep(0.05)
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(b"OK\n")
                  finally:
                      with _lock:
                          _active -= 1
              def log_message(self, *a): pass

          srv = HTTPServer(("0.0.0.0", 8080), H)
          srv.daemon_threads = True
          srv.serve_forever()

assumptions:
  - id: A1
    description: "The implementation can be forced to grant MAX_STREAMS credit on transport-level stream closure before application-level request processing completes, or advertises an excessively large initial stream limit."
    necessity: required

  - id: A2
    description: "Per-stream HTTP/3 request processing incurs non-trivial CPU work that is not cancelled promptly when the stream is closed at the transport level."
    necessity: required

  - id: A3
    description: "Caddy does not promptly cancel the in-flight backend HTTP/1.1 proxy request when the QUIC frontend stream is cancelled by the client, because HTTP/1.1 lacks stream-level cancellation and Caddy's connection pool incentivises keeping the backend TCP connection alive."
    necessity: required

  - id: A4
    description: "Backend proxy goroutines accumulate and do not retire promptly while QUIC stream credits are recycled and new frontend streams are admitted."
    necessity: required

  - id: A5
    description: "No application-layer stream-churn or reset-rate limit exists on the HTTP/3 frontend or proxy layer."
    necessity: favorable

  - id: A6
    description: "The client can predict the server's packet numbers used for carrying RESET_STREAM frames sent in response to STOP_SENDING frames, and time premature ACK frames to accelerate stream closure."
    necessity: favorable

  - id: A7
    description: "The client can predict the server's MAX_STREAMS frames and prematurely open streams using the stream credit it expects to receive before it explicitly receives it."
    necessity: favorable

suspected_mechanism:
  - step: 1
    action: >
      Start attack: open multiple QUIC connections to localhost:443 using aioquic
      with ALPN h3. For each connection, obtain stream IDs and send HTTP/3 HEADERS
      frames (method GET, path /, scheme https) WITHOUT end_stream=True — the
      stream must remain open so STOP_SENDING can be sent.

  - step: 2
    action: >
      Immediately after sending HEADERS (do NOT wait for a response), send
      STOP_SENDING on the same stream ID with error code 0. This tells the server
      the client no longer wants the response and triggers Caddy to send
      RESET_STREAM. The QUIC stream closes at the transport level.
      In aioquic: call proto._quic.stop_stream(stream_id, error_code=0)
      then proto.transmit() immediately after sending headers.

  - step: 3
    action: >
      After each STOP_SENDING, immediately open a new stream and repeat. Use
      asyncio with concurrent tasks (not threads) so many streams can be in
      flight simultaneously within a single event loop. Target rate: 100-500
      STOP_SENDING cancellations per second total across all connections.
      Do NOT use end_stream=True (FIN) — that sends a complete request; we need
      STOP_SENDING (cancellation) to test whether the backend proxy goroutine
      is left alive after the QUIC stream is cancelled.

  - step: 4
    action: >
      While attacking, poll GET http://localhost:18080/metrics every 0.5 seconds
      using the requests library (or urllib). Log the "active" field — this is
      the number of backend requests currently in flight. If A3 holds, "active"
      will grow above 0 and stay elevated (around churn_rate * 0.05s) even though
      all QUIC streams were cancelled with STOP_SENDING. Report peak "active" count
      and average "active" count during the attack in the footer output.
      Print the footer lines in this exact format:
        [HYPOGENIE:PROTOCOL_NEGOTIATED=h3]
        [HYPOGENIE:CONNECTIONS_ATTEMPTED=N]
        [HYPOGENIE:CONNECTIONS_TERMINATED_BY_SERVER=N]
        [HYPOGENIE:AVG_LIFETIME_S=N]
        [HYPOGENIE:BACKEND_PEAK_ACTIVE=N]
        [HYPOGENIE:BACKEND_AVG_ACTIVE=N]
        [HYPOGENIE:STREAMS_CANCELLED=N]

rfc_sections:
  - rfc: RFC 9000
    section: "4.6"
    dos_relevance: "Defines stream concurrency control through MAX_STREAMS and leaves the timing of additional stream credit to implementation policy. Premature credit recycling enables stream churn before proxy goroutines have retired."

  - rfc: RFC 9000
    section: "3.5"
    dos_relevance: "Describes solicited stream state transitions involving RESET_STREAM and STOP_SENDING. The gap between QUIC stream closure and in-flight backend proxy request completion is the core of the Layer 2 accumulation mechanism."

  - rfc: RFC 9000
    section: "19.11"
    dos_relevance: "Defines the MAX_STREAMS frame used to increase the cumulative stream limit. Premature issuance enables the client to open new streams before prior proxy goroutines have retired."

  - rfc: RFC 9114
    section: "4.1.1"
    dos_relevance: "Describes HTTP/3 request cancellation via STOP_SENDING. The proxy layer must decide whether to propagate cancellation to the upstream HTTP/1.1 connection; RFC 9114 does not mandate it, leaving proxy implementations vulnerable to goroutine accumulation."

related_work:
  - type: cve
    id: CVE-2023-44487

  - type: paper
    id: "MadeYouReset: Exploiting HTTP/2 Server-Side Resets for Large-Scale DoS"

  - type: writeup
    id: "quic_max_streams_v3 — same target, direct-server configuration (baseline for comparison)"
