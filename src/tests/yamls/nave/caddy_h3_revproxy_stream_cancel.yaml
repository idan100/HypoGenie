hypothesis:
  description: |
    RFC 9000 §4.6 controls peer-initiated stream concurrency through cumulative
    stream limits advertised using initial_max_streams_bidi /
    initial_max_streams_uni transport parameters and subsequently increased
    through MAX_STREAMS frames. As documented in quic_max_streams_v3, quic-go
    v0.59.1 recycles stream credit at transport-level closure before
    application-level request processing completes, enabling rapid QUIC stream
    churn.

    When Caddy is configured as an HTTP/3 → HTTP/1.1 reverse proxy, the stream
    churn vulnerability gains a second independent resource accumulation axis
    that is not present in the direct-server case:

    - Layer 1 (quic-go, same as v3): stream credit is recycled at transport-level
      stream closure before application-level request processing completes. This
      allows the client to open more new streams than the server intends to
      permit, increasing stream churn and CPU consumption from HTTP/3 goroutines.

    - Layer 2 (Caddy reverse proxy, new): each HTTP/3 stream that Caddy begins
      proxying causes Caddy to open or reuse an HTTP/1.1 connection to the
      upstream and to spawn a proxy goroutine that manages the in-flight backend
      request. If the client cancels the QUIC stream before the upstream responds,
      the proxy goroutine continues waiting for the upstream. Caddy does not
      propagate the client-side cancellation to the in-flight backend HTTP/1.1
      request promptly: HTTP/1.1 has no stream-level cancellation primitive, and
      cancelling requires closing the backend TCP connection, which Caddy's
      connection pool incentivises avoiding. The proxy goroutine therefore blocks
      until the upstream responds or the proxy timeout fires.

    The two layers compound: Layer 1 enables higher stream churn by recycling
    stream credit prematurely, and Layer 2 ensures each newly created-and-cancelled
    stream leaves a proxy goroutine alive waiting for the upstream. Under sustained
    attack, goroutines accumulate at two levels simultaneously (quic-go transport
    goroutines and Caddy proxy goroutines), causing memory and CPU exhaustion
    faster than in the direct-server case.

    Layer 2 is independently exploitable without the Layer 1 quic-go bug: an
    attacker who can open and cancel QUIC streams at the declared initial limit
    can still accumulate proxy goroutines if the upstream is slow enough that
    cancellation arrives before the upstream responds.

    Test topology (two containers on a shared Docker bridge network):
      [attack client on host]
              |
              | UDP :443, QUIC h3
              v
      [proxy container — caddy:2.11.4]  --cpus=1  <- CPU measured here
              |
              | HTTP/1.1 TCP, Docker bridge (hostname: backend)
              v
      [backend container — python:3.11-slim]
        sleeps 50ms per request before responding

    The 50ms upstream delay creates a window during which the client can send
    STOP_SENDING, causing the QUIC stream to close while the proxy goroutine
    remains alive waiting for the backend. The backend is on the shared Docker
    bridge network and reachable from the proxy as 'backend:8080'.

    Assumptions:
    - A1: The implementation can be forced to grant MAX_STREAMS credit on
          transport-level stream closure before application-level request
          processing completes, or advertises an excessively large initial
          stream limit.
    - A2: Per-stream HTTP/3 request processing incurs non-trivial CPU work
          that is not cancelled promptly when the stream is closed at the
          transport level.
    - A3: Caddy does not promptly cancel the in-flight backend HTTP/1.1 proxy
          request when the QUIC frontend stream is cancelled by the client.
    - A4: Backend proxy goroutines accumulate and do not retire promptly while
          QUIC stream credits are recycled and new frontend streams are admitted.
    - A5: No application-layer stream-churn or reset-rate limit exists on the
          HTTP/3 frontend or proxy layer.
    - A6: The client can predict the server's packet numbers for RESET_STREAM
          frames sent in response to STOP_SENDING frames, and time premature
          ACKs to accelerate stream closure without triggering protocol violations.
    - A7: The client can predict the server's MAX_STREAMS frames and prematurely
          open streams using expected credit, increasing stream churn rate.

  dos_class: resource_exhaustion

target:
  repo: https://github.com/caddyserver/caddy
  version: v2.11.4
  protocol: QUIC
  entry_point: "UDP port 443, QUIC with ALPN h3"
  services:
    - name: proxy
      role: target
      docker_image: "caddy:2.11.4"
      server_config: |
        {
            auto_https off
            admin off
        }

        :443 {
            tls /certs/server.crt /certs/server.key
            reverse_proxy backend:8080
        }

    - name: backend
      role: upstream
      docker_image: "python:3.11-slim"
      command:
        - "python3"
        - "-c"
        - |
          import time
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  time.sleep(0.05)
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b"OK\n")
              def log_message(self, *a): pass
          HTTPServer(("0.0.0.0", 8080), H).serve_forever()

assumptions:
  - id: A1
    description: "The implementation can be forced to grant MAX_STREAMS credit on transport-level stream closure before application-level request processing completes, or advertises an excessively large initial stream limit."
    necessity: required

  - id: A2
    description: "Per-stream HTTP/3 request processing incurs non-trivial CPU work that is not cancelled promptly when the stream is closed at the transport level."
    necessity: required

  - id: A3
    description: "Caddy does not promptly cancel the in-flight backend HTTP/1.1 proxy request when the QUIC frontend stream is cancelled by the client, because HTTP/1.1 lacks stream-level cancellation and Caddy's connection pool incentivises keeping the backend TCP connection alive."
    necessity: required

  - id: A4
    description: "Backend proxy goroutines accumulate and do not retire promptly while QUIC stream credits are recycled and new frontend streams are admitted."
    necessity: required

  - id: A5
    description: "No application-layer stream-churn or reset-rate limit exists on the HTTP/3 frontend or proxy layer."
    necessity: favorable

  - id: A6
    description: "The client can predict the server's packet numbers used for carrying RESET_STREAM frames sent in response to STOP_SENDING frames, and time premature ACK frames to accelerate stream closure without triggering protocol violations."
    necessity: favorable

  - id: A7
    description: "The client can predict the server's MAX_STREAMS frames and prematurely open streams using the stream credit it expects to receive before it explicitly receives it, increasing stream churn rate while keeping the server from detecting violations."
    necessity: favorable

suspected_mechanism:
  - step: 1
    action: "The client establishes a QUIC connection to the proxy container's HTTP/3 endpoint on :443 and repeatedly opens short-lived bidirectional streams carrying HTTP/3 GET requests."

  - step: 2
    action: "For each incoming HTTP/3 stream, Caddy dispatches a proxy goroutine that acquires a backend HTTP/1.1 connection from the pool and forwards the request to backend:8080. The backend sleeps 50ms before responding, leaving the proxy goroutine alive during that window."

  - step: 3
    action: "Before the backend responds (within the 50ms sleep window), the client sends a STOP_SENDING frame on the QUIC stream. quic-go responds with RESET_STREAM and closes the stream at the transport level, recycling the stream credit prematurely (A1). The client immediately opens a new stream using the recycled credit."

  - step: 4
    action: "Caddy's proxy goroutine for the cancelled stream continues waiting for the backend's HTTP/1.1 response because HTTP/1.1 has no stream-level abort (A3). The goroutine holds a backend connection in the pool and blocks until the 50ms sleep completes."

  - step: 5
    action: "Under sustained attack: stream credit recycling enables high churn rate; at any point in time there are N = churn_rate * 0.05s proxy goroutines alive simultaneously. Measure: Caddy container CPU via docker stats. Increase churn rate until CPU saturates at --cpus=1 (100% of one core)."

  - step: 6
    action: "Control experiment: adjust upstream sleep to 0ms (replace time.sleep(0.05) with no sleep). Proxy goroutines should retire immediately — CPU should drop to baseline level. This isolates Layer 2 (proxy goroutine accumulation) from Layer 1 (quic-go stream credit recycling)."

rfc_sections:
  - rfc: RFC 9000
    section: "4.6"
    dos_relevance: "Defines stream concurrency control through MAX_STREAMS and leaves the timing of additional stream credit to implementation policy. Premature credit recycling enables stream churn before proxy goroutines have retired."

  - rfc: RFC 9000
    section: "3.5"
    dos_relevance: "Describes solicited stream state transitions involving RESET_STREAM and STOP_SENDING. The gap between transport-level stream closure and in-flight backend proxy request completion is the core of the Layer 2 accumulation mechanism."

  - rfc: RFC 9000
    section: "19.11"
    dos_relevance: "Defines the MAX_STREAMS frame used to increase the cumulative stream limit. Premature issuance enables the client to open new streams before prior proxy goroutines have retired."

  - rfc: RFC 9114
    section: "4.1.1"
    dos_relevance: "Describes HTTP/3 request cancellation. When the client cancels via STOP_SENDING, the proxy layer must decide whether and how quickly to propagate that cancellation to the upstream HTTP/1.1 connection. RFC 9114 does not mandate prompt upstream cancellation, leaving proxy implementations vulnerable to goroutine accumulation."

related_work:
  - type: cve
    id: CVE-2023-44487

  - type: paper
    id: "MadeYouReset: Exploiting HTTP/2 Server-Side Resets for Large-Scale DoS"

  - type: writeup
    id: "quic_max_streams_v3 — same target, direct-server configuration (baseline for comparison)"
