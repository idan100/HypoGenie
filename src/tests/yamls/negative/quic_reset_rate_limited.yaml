hypothesis:
  description: |
    RFC 9000 §4.6 defines a cumulative MAX_STREAMS ceiling for stream
    concurrency. The HTTP/2 Rapid Reset mechanism relies on a server granting
    new stream credit faster than it reclaims resources from reset streams.

    Caddy v2.8.4 applies a per-connection stream-reset rate limit introduced
    after CVE-2023-44487 disclosures. The fix adds a configurable maximum number
    of stream resets per second per connection (default: 200/s). Exceeding this
    limit causes Caddy to send GOAWAY and close the connection.

    This hypothesis tests the same QUIC/HTTP/3 rapid-reset mechanism against the
    patched version. All three required assumptions are expected to be refuted by
    the Gap Finder because the stream-reset rate limit is present in the patched code.

    Assumptions:
    - A1: Caddy 2.8.4 grants MAX_STREAMS credit before stream cleanup completes.
    - A2: No per-stream work cancellation on RESET_STREAM.
    - A3: No stream-churn rate limit in Caddy 2.8.4.

    Suspected mechanism (should fail):
    1. Attacker sends RESET_STREAM after each new STREAM frame.
    2. Caddy rate-limit triggers after 200 resets/s → GOAWAY sent.
    3. No resource accumulation occurs.

  dos_class: resource_exhaustion

target:
  repo: https://github.com/caddyserver/caddy
  version: v2.8.4
  protocol: QUIC
  entry_point: "UDP port 443, HTTP/3 over QUIC"
  docker_image: "caddy:2.8.4"

assumptions:
  - id: A1
    description: "Caddy 2.8.4 grants MAX_STREAMS credit before stream cleanup (should be refuted)"
    necessity: required
  - id: A2
    description: "No per-stream work cancellation on RESET_STREAM"
    necessity: required
  - id: A3
    description: "No stream-churn rate limit — should be refuted in patched version"
    necessity: favorable

suspected_mechanism:
  - step: 1
    action: "Send STREAM frames followed immediately by RESET_STREAM"
  - step: 2
    action: "Caddy applies rate limit — GOAWAY terminates connection"

rfc_sections:
  - rfc: RFC 9000
    section: "4.6"
    dos_relevance: "MAX_STREAMS credit granting after stream reset"
  - rfc: RFC 9000
    section: "19.4"
    dos_relevance: "RESET_STREAM frame and stream cancellation"

related_work:
  - type: cve
    id: CVE-2023-44487
