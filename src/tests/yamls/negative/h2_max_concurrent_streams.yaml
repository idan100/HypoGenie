hypothesis:
  description: |
    RFC 7540 §5.1.2 allows a server to advertise MAX_CONCURRENT_STREAMS and to send
    RST_STREAM(REFUSED_STREAM) for streams that exceed that limit. nginx 1.26.0 sets
    http2_max_concurrent_streams to 128 by default.

    An attacker opens far more concurrent HTTP/2 streams than the advertised limit
    (e.g., 1000 streams per connection across 10 connections). The hypothesis is that
    nginx allocates a full per-request memory pool for each HEADERS frame before checking
    whether the per-connection stream count exceeds http2_max_concurrent_streams, so
    concurrent request contexts accumulate beyond the limit and exhaust nginx worker
    memory and CPU.

    The reality is that nginx enforces the stream count limit early in the HEADERS
    state machine, before allocating any request context. Excess streams receive
    RST_STREAM(REFUSED_STREAM) with negligible per-frame cost.

    Assumptions:
    - A1: nginx must read and decode each incoming HTTP/2 frame header (9 bytes:
          length, type, flags, stream ID) from the socket to determine how to handle it.
          This is an unavoidable cost of any HTTP/2 implementation.
    - A2: nginx allocates a full per-request context (ngx_http_v2_stream_t + memory pool)
          before it checks whether the concurrent stream count exceeds
          http2_max_concurrent_streams, so excess streams create real request handlers
          rather than being refused at the h2 layer.
    - A3: Accumulated per-request contexts are not freed until the stream ends, so
          opening streams beyond the limit causes nginx worker memory to grow
          proportionally to the number of accepted-then-refused streams.

  dos_class: resource_exhaustion

target:
  repo: https://github.com/nginx/nginx
  version: release-1.26.0
  protocol: HTTP/2
  entry_point: src/http/v2/ngx_http_v2.c
  docker_image: "nginx:1.26.0"
  server_config: |
    events { worker_connections 1024; }
    http {
      server {
        listen 443 ssl http2;
        ssl_certificate /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        http2_max_concurrent_streams 128;
        location / { return 200 "ok"; }
      }
    }

assumptions:
  - id: A1
    description: "nginx must read and decode every incoming HTTP/2 frame header from the socket — an unavoidable cost independent of whether the stream is accepted or refused"
    necessity: required
  - id: A2
    description: "nginx allocates a full per-request ngx_http_v2_stream_t context before checking http2_max_concurrent_streams, so excess streams create real request handlers"
    necessity: required
  - id: A3
    description: "Per-request contexts for over-limit streams accumulate and are not freed promptly, causing unbounded memory growth"
    necessity: favorable

suspected_mechanism:
  - step: 1
    action: "Open 10 concurrent HTTP/2 connections with ALPN h2 to nginx"
  - step: 2
    action: "On each connection, send HEADERS frames attempting to open 1000 concurrent streams (8x over the 128 limit)"
  - step: 3
    action: "If A2 holds, nginx allocates request contexts for all 1000 streams before enforcing the limit — memory grows proportionally"
  - step: 4
    action: "nginx enforces the limit before allocation in ngx_http_v2_state_headers(): only 128 streams per connection get a context; excess receive RST_STREAM(REFUSED_STREAM)"

rfc_sections:
  - rfc: RFC 7540
    section: "5.1.2"
    dos_relevance: "MAX_CONCURRENT_STREAMS limits active streams; server SHOULD send RST_STREAM(REFUSED_STREAM) for excess"
  - rfc: RFC 7540
    section: "6.2"
    dos_relevance: "HEADERS frames initiate stream state — attacker controls stream open rate"
