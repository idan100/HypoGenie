hypothesis:
  description: |
    RFC 7540 §5.1.2 allows a server to advertise MAX_CONCURRENT_STREAMS and to send
    RST_STREAM(REFUSED_STREAM) for streams that exceed that limit. nginx 1.26.0 sets
    http2_max_concurrent_streams to 128 by default.

    An attacker opens one HTTP/2 connection per thread and sends a single batch of
    1000 HEADERS frames (all with END_STREAM=False). The hypothesis is that nginx
    allocates a full per-request memory pool for each of the 1000 streams before
    checking the concurrent stream limit, causing 10 × 1000 = 10,000 live request
    contexts and significant memory growth.

    The attacker then holds the connection open for the full attack duration without
    sending further HEADERS or DATA — this tests whether the initial allocation cost
    is permanent. No reconnection occurs.

    The reality is that nginx enforces the stream count limit early in the HEADERS
    state machine, before any per-request memory is allocated. Only 128 streams per
    connection (1280 total) receive actual contexts. The remaining 872 per connection
    receive RST_STREAM(REFUSED_STREAM) with negligible CPU cost. After the initial
    burst the CPU returns to baseline — the hold phase generates zero nginx work.

    Assumptions:
    - A1: nginx must read and decode the HTTP/2 frame header (9 bytes: length, type,
          flags, stream ID) for every incoming HEADERS frame in order to identify and
          dispatch it. This is an unavoidable cost independent of whether the stream
          is accepted.
    - A2: nginx allocates a full per-request ngx_http_v2_stream_t context for all
          incoming HEADERS frames before checking whether the concurrent stream count
          exceeds http2_max_concurrent_streams.
    - A3: Allocated stream contexts for over-limit streams are not freed promptly,
          so opening 10,000 streams causes permanent memory growth throughout the
          attack duration.

  dos_class: memory

target:
  repo: https://github.com/nginx/nginx
  version: release-1.26.0
  protocol: HTTP/2
  entry_point: src/http/v2/ngx_http_v2.c
  docker_image: "nginx:1.26.0"
  server_config: |
    events { worker_connections 1024; }
    http {
      server {
        listen 443 ssl http2;
        ssl_certificate /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        http2_max_concurrent_streams 128;
        location / { return 200 "ok"; }
      }
    }

assumptions:
  - id: A1
    description: "nginx must read and decode every incoming HTTP/2 frame header from the socket — an unavoidable cost independent of whether the stream is accepted or refused"
    necessity: required
  - id: A2
    description: "nginx allocates a full per-request ngx_http_v2_stream_t context before checking http2_max_concurrent_streams, so excess streams create real request handlers"
    necessity: required
  - id: A3
    description: "Allocated contexts for refused streams are not freed promptly, causing permanent memory growth proportional to total streams attempted"
    necessity: favorable

suspected_mechanism:
  - step: 1
    action: "Open exactly 10 HTTP/2 connections via TLS ALPN h2 — one per attacker thread. Do NOT reconnect during the attack."
  - step: 2
    action: "On each connection, send a single one-shot batch of 1000 HEADERS frames (END_STREAM=False) as fast as possible, then stop sending HEADERS."
  - step: 3
    action: "If A2 holds: nginx allocates 10,000 stream contexts before enforcing the limit — memory grows by 10,000 × context_size bytes and stays elevated for the full duration."
  - step: 4
    action: "Hold all 10 connections open and idle for the full attack duration (do NOT send DATA, do NOT send more HEADERS, do NOT reconnect). This tests whether memory from the initial batch accumulates permanently."
  - step: 5
    action: "nginx enforces the limit before allocation: only 1,280 contexts exist (128 × 10), and the CPU cost of RST_STREAM for the 8,720 refused streams is negligible. After the initial burst (<1s), nginx CPU returns to baseline."

rfc_sections:
  - rfc: RFC 7540
    section: "5.1.2"
    dos_relevance: "MAX_CONCURRENT_STREAMS limits active streams; server SHOULD send RST_STREAM(REFUSED_STREAM) for excess"
  - rfc: RFC 7540
    section: "6.2"
    dos_relevance: "HEADERS frames initiate stream state — attacker controls stream open rate"
