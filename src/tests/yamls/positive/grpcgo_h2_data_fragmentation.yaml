hypothesis:
  description: |
    RFC 7540 §8.1 defines the HTTP/2 request/response model: a server must
    process a complete HEADERS block to initiate request handling. Apache httpd
    with mod_http2 (versions before 2.4.58, CVE-2023-44487) handles each
    HTTP/2 stream by dispatching a worker thread from the MPM thread pool.
    When a client sends HEADERS immediately followed by RST_STREAM (stream
    cancellation), the mod_http2 module must still complete the stream dispatch
    and routing work already initiated by the HEADERS frame before honoring the
    RST_STREAM cancellation.

    An attacker opens several persistent HTTP/2 connections and sends a tight
    loop of HEADERS + RST_STREAM pairs, consuming and releasing worker threads
    at a rate that keeps the thread pool saturated. Each cycle involves thread
    acquisition from the pool, request struct allocation, partial upstream
    routing, RST_STREAM processing, and cleanup — a sequence of syscalls and
    memory allocations that cannot be batched or deferred.

    Because RST_STREAM frames carry no flow-control-relevant payload, the
    attacker is never throttled by HTTP/2 connection-level flow control.
    The rate of HEADERS+RST cycles is bounded only by TLS throughput and
    the attacker's CPU, both of which greatly exceed the victim's worker
    thread capacity.

    Assumptions:
    - A1: mod_http2 dispatches a worker thread on HEADERS receipt before it can
          see the following RST_STREAM on the same stream.
    - A2: Worker thread acquisition and RST teardown cost is not amortized under
          rapid fire; each cycle burns measurable CPU in httpd's event loop.
    - A3: No per-connection RST_STREAM rate limit is enforced by mod_http2 in
          Apache httpd 2.4.57, allowing the attacker to sustain thousands of
          rapid-reset cycles per second.

    Suspected mechanism:
    1. Attacker opens 20 persistent TLS/HTTP/2 connections to port 443.
    2. Each connection: continuous loop — HEADERS (new stream) + RST_STREAM.
    3. mod_http2 processes thread dispatch + RST teardown per cycle, no back-pressure.
    4. At 500+ cycles/s per connection × 20 connections, httpd CPU saturates
       above 50% continuously for the full attack window.

  dos_class: cpu

target:
  repo: https://github.com/apache/httpd
  version: 2.4.57
  protocol: HTTP/2
  entry_point: "TCP port 443, HTTP/2 over TLS"
  docker_image: "httpd:2.4.57"

assumptions:
  - id: A1
    description: "mod_http2 acquires a worker thread to dispatch the request on HEADERS receipt, before seeing the RST_STREAM immediately following"
    necessity: required
  - id: A2
    description: "Per-cycle cost (thread acquire + dispatch + RST teardown) is non-trivial and does not amortize under rapid-reset fire"
    necessity: required
  - id: A3
    description: "Apache httpd 2.4.57 mod_http2 has no RST_STREAM rate limit per connection — attacker sustains thousands of cycles per second"
    necessity: required

suspected_mechanism:
  - step: 1
    action: "Open 20 concurrent TLS/HTTP/2 connections to Apache httpd port 443"
  - step: 2
    action: "Each connection: tight loop — send HEADERS (new stream) then RST_STREAM immediately"
  - step: 3
    action: "mod_http2 processes setup + RST teardown; no back-pressure (RST carries no flow-control credit)"
  - step: 4
    action: "CPU saturates above 50% for the full 30s attack window → CPU threshold triggered"

rfc_sections:
  - rfc: RFC 7540
    section: "8.1"
    dos_relevance: "Server must process HEADERS to route the request before RST_STREAM can terminate the stream"
  - rfc: RFC 7540
    section: "6.4"
    dos_relevance: "RST_STREAM terminates the stream immediately; server cannot delay request dispatch until RST is confirmed absent"
  - rfc: RFC 7540
    section: "6.9"
    dos_relevance: "RST_STREAM consumes no flow-control credit — attacker is never rate-limited by the HTTP/2 flow control mechanism"

related_work:
  - type: cve
    id: CVE-2023-44487
  - type: cve
    id: CVE-2023-43622
