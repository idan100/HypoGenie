hypothesis:
  description: |
    RFC 7540 §6.9 governs payload byte accounting for HTTP/2 flow control — it
    sets no bound on per-frame struct overhead. gRPC-Go allocates a separate
    recvMsg struct in its recvBuffer for every inbound DATA frame, regardless
    of size. When an attacker sends millions of 1-byte DATA frames within the
    negotiated flow-control window, the receiver accumulates one recvMsg per
    frame. Each struct carries ~200 bytes of Go metadata, so a 64 KB window
    filled with 65,536 single-byte frames creates ~13 MB of struct overhead —
    a 200× amplification ratio.

    This is not a compliance violation: RFC 7540 permits arbitrary DATA
    fragmentation and gRPC's per-frame allocation is not mandated by the spec.
    The required invariant (a per-connection cap on concurrent stream count or
    on total handler goroutines) was simply never implemented.

    The practical exploit opens 200 concurrent streams per connection. Each
    stream spawns a handler goroutine. With 10 connections × 200 streams = 2000
    handler goroutines simultaneously processing 1-byte DATA frames, the Go
    scheduler is saturated — CPU spikes and service latency degrades.

    Assumptions:
    - A1: gRPC-Go allocates one recvMsg struct per inbound DATA frame in recvBuffer.
    - A2: Flow-control window refund is issued per-frame (attacker keeps sending).
    - A3: No per-connection cap on recvMsg count or aggregate struct size.

    Suspected mechanism:
    1. Attacker opens an HTTP/2 stream over gRPC connection.
    2. Attacker sends 65,536 DATA frames of 1 byte each (filling 64 KB window).
    3. Server allocates one recvMsg per frame → 65,536 × ~200 bytes = ~13 MB overhead.
    4. Server issues WINDOW_UPDATE per consumed byte → attacker refills window.
    5. Repeat across multiple streams → heap exhaustion.

  dos_class: cpu

target:
  repo: https://github.com/grpc/grpc-go
  version: v1.68.1
  protocol: gRPC
  entry_point: "TCP port 443, gRPC over HTTP/2 over TLS"
  docker_image: "hypogenie/grpcgo-server:v1.68.1"

assumptions:
  - id: A1
    description: "One recvMsg struct allocated per inbound DATA frame in recvBuffer"
    necessity: required
  - id: A2
    description: "Per-frame WINDOW_UPDATE issued allowing attacker to refill window continuously"
    necessity: required
  - id: A3
    description: "recvBuffer is an unbounded queue — it accumulates recvMsg structs without any connection-level size limit (see internal/transport/transport.go)"
    necessity: required

suspected_mechanism:
  - step: 1
    action: "Open 200 concurrent gRPC streams per connection across 10 connections (2000 streams total)"
  - step: 2
    action: "Each stream: continuously send 1-byte DATA frames without closing — HEADERS sent once, then DATA loop"
  - step: 3
    action: "Each stream spawns one handler goroutine in gRPC-Go's transport layer"
  - step: 4
    action: "2000 active goroutines all receiving DATA frames + each recvBuffer accumulating structs → CPU saturation from goroutine scheduling"
  - step: 5
    action: "WINDOW_UPDATE per consumed byte keeps all 2000 streams fed continuously — CPU stays pegged"

rfc_sections:
  - rfc: RFC 7540
    section: "6.9"
    dos_relevance: "Flow-control accounting — governs byte credits but not per-frame struct allocation"
  - rfc: RFC 7540
    section: "6.1"
    dos_relevance: "DATA frame fragmentation — spec permits arbitrary fragment sizes"

related_work:
  - type: cve
    id: CVE-2026-84304
  - type: cve
    id: CVE-2023-44487
