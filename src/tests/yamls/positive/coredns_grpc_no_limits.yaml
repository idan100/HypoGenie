hypothesis:
  description: |
    CoreDNS applies no limit on the number of concurrent in-flight DNS queries
    per TCP/TLS connection. RFC 7766 §6.2.2 requires that servers impose a
    timeout on idle and in-flight queries, but CoreDNS sets no per-connection
    query cap and no in-flight query limit by default.

    CoreDNS's DNS-over-TLS listener accepts pipelined queries: a client may send
    multiple DNS requests on a single TLS connection without waiting for replies.
    Each inbound query spawns a goroutine that persists until the response is sent.
    With no cap on outstanding queries, an attacker can flood a single TLS
    connection with thousands of pipelined queries. Each query goroutine lives for
    the full response time, causing goroutine and memory accumulation.

    Assumptions:
    - A1: CoreDNS DNS-over-TLS listener accepts pipelined queries with no
          per-connection in-flight limit.
    - A2: Each pipelined query spawns a goroutine that persists until the
          response is sent back to the client.
    - A3: No global goroutine or memory cap terminates the connection
          before goroutines accumulate.

    Suspected mechanism:
    1. Attacker opens 50 TLS connections to CoreDNS port 443.
    2. Each connection rapidly sends many DNS queries without reading responses
       (pipelining) — queries accumulate in the server's read buffer.
    3. CoreDNS spawns one goroutine per query, holding each goroutine for the
       full query processing time.
    4. Goroutines accumulate faster than they complete → heap exhaustion.

  dos_class: memory

target:
  repo: https://github.com/coredns/coredns
  version: v1.11.4
  protocol: DNS-over-TLS
  entry_point: "TCP port 443, DNS-over-TLS"
  docker_image: "coredns/coredns:1.11.4"

assumptions:
  - id: A1
    description: "DNS-over-TLS listener accepts unlimited pipelined queries per connection — CoreDNS imposes no per-connection in-flight query cap"
    necessity: required
  - id: A2
    description: "One goroutine spawned per pipelined query, lives until response sent"
    necessity: required
  - id: A3
    description: "CoreDNS applies no connection-level goroutine or memory limit that would terminate pipelining before goroutines accumulate"
    necessity: favorable

suspected_mechanism:
  - step: 1
    action: "Open 50 concurrent TLS connections to CoreDNS port 443"
  - step: 2
    action: "Each connection pipelines DNS queries as fast as possible without reading replies"
  - step: 3
    action: "CoreDNS spawns one goroutine per query, each held for query processing time"
  - step: 4
    action: "Goroutines accumulate — heap and goroutine count grow → memory exhaustion"

rfc_sections:
  - rfc: RFC 7766
    section: "6.2.2"
    dos_relevance: "DNS-over-TCP servers MUST impose timeout on idle/in-flight queries"
  - rfc: RFC 7766
    section: "6.2.1"
    dos_relevance: "DNS-over-TCP servers SHOULD limit concurrent connections"

related_work:
  - type: cve
    id: CVE-2023-28452
