hypothesis:
  description: |
    RFC 7858 §5.1 states: "To mitigate the risk of a potential DoS, a server SHOULD
    limit the number of concurrent TCP/TLS connections." CoreDNS 1.11.x implements
    DNS-over-TLS (DoT) via a goroutine-per-connection model in the tls server plugin.
    When a TLS connection is accepted, CoreDNS dispatches a new goroutine to handle
    the DNS stream and must decrypt each inbound TLS record and encrypt each response.

    An attacker establishes 50 persistent TLS connections and pipelines DNS queries
    continuously (no read-back delay) at the maximum rate the socket allows. CoreDNS
    must perform TLS record decryption + DNS message parsing + DNS response encoding +
    TLS record encryption for every query. With no per-IP connection limit or query-rate
    limit enforced by default, the aggregate TLS + DNS processing CPU saturates the
    server's single vCPU allocation for the full attack window.

    Assumptions:
    - A1: CoreDNS DoT listener processes each pipelined query in the same goroutine,
          consuming CPU for TLS record decryption + DNS parse + encode + TLS encryption.
    - A2: No default per-IP or per-listener connection cap or query-rate limit prevents
          the attacker from opening dozens of persistent TLS connections and flooding queries.
    - A3: The aggregate CPU overhead of pipelined TLS DNS processing is disproportionate
          to what the same number of plain TCP connections (no queries) would cause.

    Suspected mechanism:
    1. Attacker opens 50 concurrent TLS connections to port 853.
    2. Each connection: pipeline DNS queries as fast as the socket allows (no throttle).
    3. CoreDNS processes each query: TLS decrypt + DNS parse + erratic lookup + DNS encode + TLS encrypt.
    4. At ~8000 queries/s × 50 connections, TLS + DNS processing saturates CPU above 50pp.
    5. Control experiment: same 50 TLS connections held open but no queries → near-zero CPU,
       confirming query processing (not connection overhead) is the CPU driver.

  dos_class: cpu

target:
  repo: https://github.com/coredns/coredns
  version: v1.11.3
  protocol: DNS-over-TLS
  entry_point: "TCP port 853, DNS-over-TLS (RFC 7858)"
  docker_image: "coredns/coredns:1.11.3"

assumptions:
  - id: A1
    description: "CoreDNS DoT listener processes each pipelined query within the connection goroutine, performing TLS record decryption + DNS parse + erratic lookup + TLS encryption per query"
    necessity: required
  - id: A2
    description: "No default per-IP connection limit or query-rate limit prevents the attacker from opening 50 persistent TLS connections and flooding queries"
    necessity: required
  - id: A3
    description: "Aggregate CPU from TLS + DNS processing across pipelined queries exceeds 50pp delta sustained for 5s; hold-only control (same connections, no queries) confirms query processing — not connection overhead — is the driver"
    necessity: favorable

suspected_mechanism:
  - step: 1
    action: "Open 50 persistent TLS connections to port 853 (DoT listener)"
  - step: 2
    action: "Pipeline DNS queries continuously on each connection at maximum socket throughput"
  - step: 3
    action: "CoreDNS processes each query: TLS decrypt + DNS parse + erratic response + DNS encode + TLS encrypt"
  - step: 4
    action: "Aggregate ~8000 queries/s × TLS record overhead saturates single-vCPU above 50pp"
  - step: 5
    action: "Control experiment (hold-only, no queries) shows near-zero CPU, confirming query processing is causal"

rfc_sections:
  - rfc: RFC 7858
    section: "5.1"
    dos_relevance: "DoT servers SHOULD limit concurrent connections; no built-in cap in CoreDNS allows goroutine exhaustion"
  - rfc: RFC 7858
    section: "3.3"
    dos_relevance: "Query pipelining on a single TLS connection allows attacker to open many in-flight queries per connection"
  - rfc: RFC 7858
    section: "3.4"
    dos_relevance: "Out-of-order responses allowed; server must buffer each in-flight query state separately"

related_work:
  - type: cve
    id: CVE-2026-71249
  - type: cve
    id: CVE-2023-28452
