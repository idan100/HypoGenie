hypothesis:
  description: |
    RFC 7540 §6.4 states that RST_STREAM terminates a stream immediately but does not
    undo work already begun by the server. golang.org/x/net/http2 versions before v0.17.0
    (CVE-2023-44487 / CVE-2023-39325) process each HEADERS frame by spawning a full
    goroutine and routing the request before the client's RST_STREAM can be acted upon.
    When the client immediately sends RST_STREAM (error code CANCEL) after HEADERS,
    the server goroutine has already been scheduled; teardown cost accumulates per cycle.

    An attacker opens multiple long-lived HTTP/2 connections and on each sends a
    continuous stream of HEADERS + RST_STREAM pairs as fast as the h2 library allows.
    For each cycle, the Go runtime allocates a goroutine, routes the request, then
    processes RST_STREAM and tears the state down. The CPU cost of goroutine scheduling
    plus TLS record processing accumulates faster than the server can shed load.

    Assumptions:
    - A1: golang.org/x/net/http2 dispatches a new goroutine on HEADERS receipt before
          checking for a subsequent RST_STREAM on the same stream.
    - A2: RST_STREAM after HEADERS forces goroutine creation + teardown; this cost is
          not amortized at high rates (~5000 cycles/s across 20 connections).
    - A3: No per-connection RST_STREAM rate limit is enforced in golang.org/x/net@v0.15.0;
          the attacker sustains thousands of rapid-reset cycles per second.

    Suspected mechanism:
    1. Attacker opens 20 concurrent TLS/HTTP/2 connections to port 443.
    2. Each connection: tight loop — send HEADERS (new stream) + RST_STREAM (CANCEL).
    3. Server schedules a goroutine per HEADERS frame; RST_STREAM cancels it.
    4. At ~5000 cycles/s across all connections, Go runtime goroutine churn
       saturates the CPU above 50pp continuously for the attack duration.

  dos_class: cpu

target:
  repo: https://github.com/golang/net
  version: v0.15.0
  protocol: HTTP/2
  entry_point: "TCP port 443, HTTP/2 over TLS"
  docker_image: "caddy:2.7.6"

assumptions:
  - id: A1
    description: "golang.org/x/net/http2 dispatches a new goroutine on HEADERS receipt before the RST_STREAM that immediately follows is processed"
    necessity: required
  - id: A2
    description: "RST_STREAM goroutine creation + teardown cost is non-trivial per cycle and does not amortize under rapid fire (~5000 cycles/s)"
    necessity: required
  - id: A3
    description: "golang.org/x/net@v0.15.0 has no per-connection RST_STREAM rate limit — attacker sustains thousands of rapid-reset cycles per second"
    necessity: required

suspected_mechanism:
  - step: 1
    action: "Open 20 concurrent TLS/HTTP/2 connections to port 443"
  - step: 2
    action: "Each connection: tight loop — send HEADERS (new stream ID) then RST_STREAM immediately"
  - step: 3
    action: "Server dispatches goroutine per HEADERS; RST_STREAM triggers teardown; no back-pressure"
  - step: 4
    action: "CPU saturates above 50% for the full 30s attack window → CPU threshold triggered"

rfc_sections:
  - rfc: RFC 7540
    section: "6.4"
    dos_relevance: "RST_STREAM terminates a stream immediately; server cannot defer goroutine allocation until it is sure no RST will follow"
  - rfc: RFC 7540
    section: "8.1.2"
    dos_relevance: "Server must process HEADERS block to route the request; RST_STREAM does not undo already-initiated goroutine scheduling"
  - rfc: RFC 7540
    section: "6.9"
    dos_relevance: "RST_STREAM carries no DATA payload — flow-control credit is not consumed, allowing unlimited rapid-reset cycles"

related_work:
  - type: cve
    id: CVE-2023-44487
  - type: cve
    id: CVE-2023-39325
