hypothesis:
  description: |
    RFC 8446 §4.6.3 defines the TLS 1.3 KeyUpdate handshake message. When
    a peer sends KeyUpdate(update_requested), the recipient MUST respond
    with its own KeyUpdate(not_requested) and then update both the read
    and write traffic keys using HKDF-Expand-Label (RFC 8446 §7.2). This
    is a mandatory symmetric operation: each inbound KeyUpdate(update_requested)
    forces a full HKDF key derivation cycle on the server.

    The suspected vulnerability: nginx compiled against OpenSSL 3.x processes
    KeyUpdate messages inside the TLS record layer. An attacker can send
    KeyUpdate(update_requested) messages at high frequency over an established
    TLS 1.3 connection. Each message forces nginx/OpenSSL to:
    1. Derive a new sender write key (HKDF-Expand-Label over SHA-256 or SHA-384).
    2. Derive a new receiver read key.
    3. Update the AES-GCM or ChaCha20-Poly1305 cipher context.

    Key derivation is intentionally compute-intensive. Even at modest rates
    (e.g., 1,000 KeyUpdate messages per second), the aggregate cost of HKDF
    operations across many concurrent connections can saturate a CPU core.

    OpenSSL does not enforce a rate limit on inbound KeyUpdate messages
    within a TLS session. RFC 8446 imposes no maximum frequency.

    Assumptions:
    - A1: nginx uses TLS 1.3 and OpenSSL does not reject or throttle
          KeyUpdate messages beyond what the record layer processes.
    - A2: Each KeyUpdate(update_requested) triggers a full HKDF key
          derivation and cipher context update on the server side.
    - A3: The HKDF cost per KeyUpdate is non-trivial relative to the
          cost of sending the message over an established TLS session.
    - A4: nginx does not impose a per-connection or global rate limit
          on KeyUpdate processing.

  dos_class: cpu

target:
  repo: https://github.com/nginx/nginx
  version: "1.25.4"
  protocol: TLS
  entry_point: "TCP port 443, TLS 1.3 only (tls_protocols TLSv1.3)"
  docker_image: "nginx:1.25.4"
  server_config: |
    events { worker_processes 1; worker_connections 1024; }
    http {
      server {
        listen 443 ssl;
        ssl_certificate     /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;
        ssl_protocols TLSv1.3;
        ssl_ciphers TLS_AES_128_GCM_SHA256;
        location / { return 200 "ok"; }
      }
    }

assumptions:
  - id: A1
    description: "nginx 1.25.4 compiled with OpenSSL accepts and processes TLS 1.3 KeyUpdate messages on established connections without rate limiting."
    necessity: required

  - id: A2
    description: "Each inbound KeyUpdate(update_requested) causes OpenSSL to perform a full HKDF-Expand-Label derivation for both send and receive keys."
    necessity: required

  - id: A3
    description: "The per-KeyUpdate HKDF cost is measurably higher than the cost of transmitting an equivalent-sized TLS application record."
    necessity: required

  - id: A4
    description: "nginx provides no built-in mechanism to cap the rate of KeyUpdate messages per connection or globally."
    necessity: required

suspected_mechanism:
  - step: 1
    action: "Attacker opens N TLS 1.3 connections to nginx, negotiating TLS_AES_128_GCM_SHA256 (highest supported cipher strength for HKDF-SHA256)."
  - step: 2
    action: "On each connection, attacker sends KeyUpdate(update_requested) messages at the maximum rate accepted before receiving the corresponding response."
  - step: 3
    action: "nginx/OpenSSL performs HKDF key expansion for both directions on every inbound KeyUpdate, forcing symmetric CPU-bound key derivation."
  - step: 4
    action: "Measure nginx worker CPU under a range of KeyUpdate rates and connection counts, comparing to a baseline of equivalent TLS throughput without KeyUpdate."
  - step: 5
    action: "Determine whether the CPU cost of KeyUpdate processing can exceed the cost of serving the same number of HTTP requests over those connections."

rfc_sections:
  - rfc: RFC 8446
    section: "4.6.3"
    dos_relevance: |
      KeyUpdate is a post-handshake message defined for TLS 1.3. When
      update_requested is set, the recipient MUST reply with its own
      KeyUpdate before sending further application data, and MUST update
      its sending keys before the reply. The mandatory symmetric key
      update on every request creates a CPU amplification vector: the
      attacker pays only the cost of sending the message; the server pays
      full HKDF derivation cost on receive plus an additional derivation
      and context-switch on reply.

  - rfc: RFC 8446
    section: "7.2"
    dos_relevance: |
      Defines traffic key derivation using HKDF-Expand-Label over the
      negotiated PRF hash. The derivation is intentionally non-trivial to
      prevent brute-force key recovery. This same computational cost applies
      when processing KeyUpdate messages, creating a potential CPU exhaustion
      path under repeated updates.

related_work:
  - type: writeup
    url: https://blog.filippo.io/we-need-to-talk-about-session-tickets/
